<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>__BRAND_DOCUMENT_TITLE__</title>
  <link id="brand-favicon" rel="icon" href="__BRAND_LOGO_URL__" />
  <link rel="stylesheet" href="/static/style.css" />
  <link rel="stylesheet" href="/static/chat-workspace.css" />
  <link rel="stylesheet" href="/static/desktop-ui.css" />
  <script src="/static/desktop-ui.js" defer></script>
</head>
<body class="chat-page is-booting" aria-busy="true">
  <button class="mobile-scrim" id="mobile-scrim" aria-label="关闭侧栏"></button>
  <div class="chat-shell">
    <aside class="chat-sidebar" id="sidebar" aria-label="对话导航">
      <div class="sidebar-brand">
        <div id="brand-title" class="brand-mark">__BRAND_MARKUP__</div>
        <button class="icon-button" id="sidebar-toggle" title="收起侧栏" aria-label="收起侧栏">
          <span data-icon="panel"></span>
        </button>
      </div>
      <button class="new-thread" id="new-chat-btn" title="新对话" aria-label="新对话">
        <span class="nav-icon" data-icon="plus"></span><span>新对话</span>
        <kbd>Ctrl K</kbd>
      </button>
      <button class="icon-button rail-only" id="sidebar-expand" aria-label="展开侧栏" title="展开侧栏" hidden>
        <span data-icon="panel"></span>
      </button>
      <button class="icon-button rail-only" id="rail-search" aria-label="搜索对话" title="搜索对话"><span data-icon="search"></span></button>
      <button class="icon-button rail-only" id="rail-projects" aria-label="查看项目" title="查看项目"><span data-icon="folder"></span></button>
      <div class="history-search">
        <span data-icon="search" data-icon-size="16"></span>
        <input id="history-search" placeholder="搜索对话" autocomplete="off" aria-label="搜索对话" />
      </div>
      <section class="sidebar-section pinned-section" id="pinned-section" hidden>
        <div class="sidebar-label sidebar-section-head pinned-section-head">
          <button class="sidebar-section-toggle section-title-toggle" id="pinned-section-toggle" aria-expanded="true">
            <span>置顶</span><span class="section-chevron" data-icon="chevronDown" data-icon-size="13"></span>
          </button>
        </div>
        <div class="project-list pinned-project-list" id="pinned-project-list"></div>
      </section>
      <section class="sidebar-section" id="project-section">
        <div class="sidebar-label sidebar-section-head project-section-head">
          <button class="sidebar-section-toggle section-title-toggle" id="project-section-toggle" aria-expanded="true">
            <span>项目</span><span class="section-chevron" data-icon="chevronDown" data-icon-size="13"></span>
          </button>
          <span class="section-head-actions project-section-actions">
            <button class="sidebar-action-button" id="new-project-btn" title="新建项目" aria-label="新建项目"><span data-icon="plus" data-icon-size="15"></span></button>
          </span>
        </div>
        <div class="project-list" id="project-list">
          <div class="sidebar-loading" aria-hidden="true">
            <span></span><span></span>
          </div>
        </div>
      </section>
      <section class="sidebar-section recent-section" id="recent-section">
        <div class="sidebar-label sidebar-section-head recent-section-head">
          <button class="sidebar-section-toggle section-title-toggle" id="recent-section-toggle" aria-expanded="true">
            <span id="history-label">最近</span>
            <span class="section-chevron" data-icon="chevronDown" data-icon-size="13"></span>
          </button>
          <span class="section-head-actions recent-section-actions">
            <button class="sidebar-action-button" id="recent-new-chat-btn" title="新建对话" aria-label="新建对话"><span data-icon="edit" data-icon-size="14"></span></button>
          </span>
        </div>
        <div class="thread-list" id="history-panel">
          <div class="sidebar-loading" aria-hidden="true">
            <span></span><span></span><span></span>
          </div>
        </div>
      </section>
      <div class="sidebar-account">
        <button class="account-trigger" id="account-menu-btn" aria-label="账户菜单" aria-haspopup="menu" aria-controls="account-menu" aria-expanded="false">
          <span class="avatar" id="user-avatar">U</span>
          <span class="account-copy"><strong id="account-name"></strong><span id="account-role"></span></span>
          <span class="account-menu-chevron" data-icon="chevronDown" data-icon-size="16"></span>
        </button>
        <div class="account-menu" id="account-menu" role="menu" aria-label="账户" hidden>
          <a href="/admin#preferences" id="admin-link" role="menuitem" hidden><span data-icon="settings"></span>后台管理</a>
          <a href="/login" id="login-link" role="menuitem" hidden><span data-icon="users"></span>登录账户</a>
          <button class="danger-text" id="logout-btn" role="menuitem" hidden><span data-icon="logout"></span>退出登录</button>
          <div class="account-theme">
            <span class="account-theme-label" id="account-theme-label">外观</span>
            <div class="account-theme-options" id="account-theme-options" role="group" aria-labelledby="account-theme-label">
              <button type="button" data-account-theme="light" role="menuitemradio" aria-checked="false"><span data-icon="sun" data-icon-size="15"></span>浅色</button>
              <button type="button" data-account-theme="dark" role="menuitemradio" aria-checked="false"><span data-icon="moon" data-icon-size="15"></span>深色</button>
              <button type="button" data-account-theme="system" role="menuitemradio" aria-checked="true" aria-label="跟随系统" title="跟随系统"><span data-icon="panel" data-icon-size="15"></span>系统</button>
            </div>
          </div>
        </div>
      </div>
    </aside>

    <main class="conversation-pane">
      <div class="attachment-drop-overlay" id="attachment-drop-overlay" aria-hidden="true">
        <div class="attachment-drop-card">
          <span data-icon="paperclip" data-icon-size="24"></span>
          <strong>松开即可添加附件</strong>
          <small>文件会加入当前对话，发送前仍可移除</small>
        </div>
      </div>
      <header class="conversation-header">
        <button class="icon-button mobile-only" id="mobile-sidebar" aria-label="打开侧栏">
          <span data-icon="menu"></span>
        </button>
        <button class="agent-selector" id="agent-selector" aria-haspopup="menu" aria-expanded="false">
          <span class="agent-selector-copy">
            <strong id="agent-name">选择智能体</strong>
          </span>
          <span class="chevron" data-icon="chevronDown" data-icon-size="15"></span>
        </button>
        <div class="agent-menu" id="agent-menu" role="menu"></div>
        <div class="header-spacer"></div>
        <button class="header-action" id="details-toggle" title="查看过程" aria-label="查看运行详情" aria-controls="run-drawer" aria-expanded="false" hidden>
          <span data-icon="history"></span><span>查看过程</span>
        </button>
      </header>

      <section class="messages" id="chat-log" aria-live="polite">
        <div class="welcome" id="welcome">
          <div class="welcome-logo" id="welcome-logo"><span data-icon="sparkles" data-icon-size="24"></span></div>
          <h1 id="welcome-title">今天想完成什么？</h1>
          <p id="welcome-copy">选择一个智能体并描述目标；复杂任务会生成可动态调整的计划，并实时展示当前步骤。</p>
        </div>
      </section>

      <aside class="schedule-reminders" id="schedule-reminders" aria-live="polite" hidden>
        <div class="schedule-reminders-head">
          <span data-icon="history" data-icon-size="15"></span>
          <div><strong>定时提醒</strong><small>结果追加到当前对话</small></div>
        </div>
        <div class="schedule-reminder-list" id="schedule-reminder-list"></div>
      </aside>

      <section class="composer-wrap">
        <div class="composer-status-row" aria-label="任务进度和阅读位置">
          <section class="turn-progress-dock" id="turn-progress-dock" aria-live="polite" hidden>
          <div class="turn-progress-card" id="turn-progress-card" role="status"
            aria-label="当前任务计划">
            <div class="turn-progress-steps" id="turn-progress-steps" role="list"></div>
          </div>
          <button class="turn-progress-toggle" id="turn-progress-toggle" type="button"
            aria-controls="turn-progress-card" aria-expanded="false"
            title="悬停查看当前任务进度">
            <i aria-hidden="true"></i>
            <span id="turn-progress-count">第 1 / 1 步</span>
          </button>
          </section>
          <button class="jump-to-latest" id="jump-to-latest" type="button" hidden>
            <span aria-hidden="true">↓</span> 回到最新
          </button>
        </div>
        <div class="picker-popover command-palette" id="resource-picker" role="listbox"></div>
        <div class="approval-policy-menu" id="approval-policy-menu" role="menu" aria-label="批准策略" hidden></div>
        <div class="reasoning-menu" id="reasoning-menu" role="dialog" aria-label="模型与推理强度" hidden>
          <div class="reasoning-menu-head">
            <button class="reasoning-model-link" id="reasoning-model-btn" type="button" aria-label="更换模型" aria-controls="model-menu" aria-expanded="false">
              <span class="reasoning-current"><strong id="reasoning-current-label">默认</strong><span data-icon="chevronDown" data-icon-size="14"></span></span>
              <span class="reasoning-current-model" id="reasoning-current-model"></span>
            </button>
            <button class="icon-button reasoning-reset" id="reasoning-reset" type="button" title="重置为模型默认强度" aria-label="重置为模型默认强度"><span data-icon="restore" data-icon-size="19"></span></button>
          </div>
          <div class="model-menu" id="model-menu" role="menu" aria-label="模型" hidden></div>
          <div class="reasoning-slider-wrap" id="reasoning-slider-wrap">
            <div class="reasoning-slider-track" aria-hidden="true"><div class="reasoning-slider-fill" id="reasoning-slider-fill"></div><div class="reasoning-slider-energy" id="reasoning-slider-energy"></div><div class="reasoning-slider-ticks" id="reasoning-slider-ticks"></div></div>
            <input id="reasoning-slider" type="range" min="0" max="0" step="1" value="0" aria-label="推理强度" aria-valuetext="默认" />
          </div>
          <p class="reasoning-unavailable" id="reasoning-unavailable" hidden></p>
        </div>
        <div class="composer-add-menu" id="composer-add-menu" role="menu" aria-label="添加内容">
          <label class="composer-menu-item" role="menuitem">
            <span data-icon="paperclip"></span>
            <span><strong>上传附件</strong><small>也可拖放文件或从剪贴板粘贴</small></span>
            <input type="file" id="attach-input" multiple hidden />
          </label>
          <button class="composer-menu-item" id="mention-menu-btn" role="menuitem">
            <span data-icon="at"></span>
            <span><strong>引用内容</strong><small>选择知识库或模板</small></span>
          </button>
          <button class="composer-menu-item" id="command-btn" role="menuitem">
            <span data-icon="blocks"></span>
            <span><strong>调用能力</strong><small>选择 Skill、MCP 或智能体</small></span>
          </button>
        </div>
        <div class="composer">
          <div class="message-staging" id="message-staging" aria-live="polite"></div>
          <div class="composer-project-context" id="composer-project-context" aria-label="当前项目" hidden>
            <span data-icon="folder" data-icon-size="15"></span>
            <strong id="composer-project-name"></strong>
          </div>
          <div class="attachment-pills" id="attach-chips" aria-live="polite"></div>
          <div class="composer-editor" id="composer-editor">
            <div class="context-pills" id="mention-pills" aria-label="已引用和调用的内容，光标在正文开头时可按 Backspace 移除"></div>
            <textarea id="query" rows="2" placeholder="随心输入" aria-label="消息内容"></textarea>
          </div>
          <div class="composer-toolbar">
            <div class="composer-primary-actions">
              <button class="composer-icon add-action" id="add-menu-btn" title="添加内容" aria-label="添加内容"
                aria-haspopup="menu" aria-expanded="false">
                <span data-icon="plus"></span>
              </button>
              <button class="composer-icon approval-policy-button" id="approval-policy-btn" title="批准策略" aria-label="选择批准策略" aria-controls="approval-policy-menu" aria-haspopup="menu" aria-expanded="false">
                <span data-icon="shield" data-icon-size="18"></span><span class="approval-policy-label" id="approval-policy-label">请求批准</span>
              </button>
            </div>
            <div class="composer-tools">
              <button class="composer-icon model-select-button" id="model-btn" title="模型与推理强度" aria-label="选择模型与推理强度" aria-controls="reasoning-menu" aria-haspopup="dialog" aria-expanded="false">
                <span class="model-select-label" id="model-btn-label">智能体自动</span><span class="reasoning-effort-label" id="reasoning-effort-label" hidden></span><span data-icon="chevronDown" data-icon-size="12"></span>
              </button>
              <button class="composer-icon" id="mic-btn" title="语音输入" aria-label="开始语音输入"><span data-icon="mic"></span></button>
              <button class="send-action" id="send-btn" title="开始语音输入" aria-label="开始语音输入">
                <span data-icon="waveform"></span>
              </button>
            </div>
          </div>
        </div>
        <p class="composer-hint">重要信息请核实。</p>
      </section>
    </main>

    <aside class="run-drawer" id="run-drawer" aria-label="运行详情" aria-hidden="true" inert>
      <div class="drawer-head">
        <div>
          <span class="eyebrow">任务执行记录</span>
          <strong>运行详情</strong>
          <span id="run-status">尚未运行</span>
        </div>
        <button class="icon-button" id="drawer-close" aria-label="关闭运行详情"><span data-icon="close"></span></button>
      </div>
      <p class="drawer-copy">按实际执行查看当前阶段、操作记录和验证结果。</p>
      <div class="run-summary" id="run-summary"></div>
      <section class="run-phase-summary" id="run-phase-summary" aria-label="任务阶段" hidden></section>
      <section class="evidence-center" id="evidence-center" aria-label="Evidence Tree" hidden></section>
      <div class="run-event-filters" id="run-event-filters" role="group" aria-label="筛选执行记录">
        <button type="button" data-event-filter="all" aria-pressed="true">全部</button>
        <button type="button" data-event-filter="tools" aria-pressed="false">工具</button>
        <button type="button" data-event-filter="approval" aria-pressed="false">审批</button>
        <button type="button" data-event-filter="verification" aria-pressed="false">验证</button>
      </div>
      <p class="run-events-empty" id="run-events-empty">暂无执行记录，发送任务后可在这里查看。</p>
      <div class="run-events" id="run-events"></div>
    </aside>
  </div>

  <div class="thread-context-menu" id="thread-context-menu" role="menu" hidden>
    <button id="context-pin-btn" role="menuitem"><span data-icon="pin"></span><span id="context-pin-label">置顶</span></button>
    <button id="context-rename-btn" role="menuitem"><span data-icon="edit"></span>重命名</button>
    <button id="context-memory-btn" role="menuitem"><span data-icon="database"></span>记忆治理</button>
    <button id="context-archive-btn" role="menuitem"><span data-icon="archive"></span>归档</button>
  </div>

  <div class="thread-context-menu" id="project-context-menu" role="menu" hidden>
    <button id="project-context-pin-btn" role="menuitem"><span data-icon="pin"></span><span id="project-context-pin-label">置顶</span></button>
    <button id="project-context-edit-btn" role="menuitem"><span data-icon="edit"></span>项目设置</button>
    <button id="project-context-archive-btn" role="menuitem"><span data-icon="archive"></span>归档</button>
  </div>

  <dialog id="rename-thread-dialog" class="compact-dialog">
    <h3>重命名对话</h3>
    <label for="rename-thread-name">对话名称</label>
    <input id="rename-thread-name" maxlength="80" />
    <div class="error" id="rename-thread-error"></div>
    <div class="dialog-actions">
      <button class="btn ghost" id="rename-thread-cancel">取消</button>
      <button class="btn" id="rename-thread-save">保存</button>
    </div>
  </dialog>

  <script src="/static/common.js"></script>
  <script src="/static/guardrail-notifications.js" defer></script>
  <script src="/static/run-workspace.js"></script>
  <script src="/static/chat-workspace.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
