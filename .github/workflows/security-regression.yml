name: security-regression

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-regression:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      APP_ENV: production
      JWT_SECRET: ci-only-jwt-secret-with-at-least-32-random-bytes
      SECRET_MASTER_KEY: ci-only-envelope-key-with-at-least-32-random-bytes
      ROOT_PASSWORD: CI-Root-Password-Not-Used-123!
      AUTH_COOKIE_SECURE: "true"
      # Job-level env is evaluated before a runner exists, so runner.temp is not
      # available here. This ignored workspace path is valid on Ubuntu/Windows.
      APP_DATA_DIR: ${{ github.workspace }}/data_harness_test
      JOB_WORKER_ENABLED: "false"
      CRON_SCHEDULER_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Prepare isolated runtime fixtures
        run: >-
          python -c "import os; from pathlib import Path; p=Path(os.environ['APP_DATA_DIR'])/'branding'/'favicon.svg'; p.parent.mkdir(parents=True, exist_ok=True); p.write_text('ci-branding-fixture', encoding='utf-8')"
      - name: Run fail-closed release preflight without deployment database
        run: python tools/release_preflight.py --skip-database
      - name: Compile backend
        run: python -m compileall -q backend migrations tests
      - name: Rehearse migrations and SQLite online backup without credentials
        run: python -m unittest tests.test_release_baseline -v
      - name: Run security and application regressions
        run: python -W error::ResourceWarning -m unittest discover -s tests -p "test_*.py" -v
      - name: Check frontend JavaScript syntax
        run: python tools/check_javascript.py

  browser-smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run real Chromium smoke
        shell: pwsh
        run: ./tools/playwright_smoke.ps1 -Python python
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-windows-smoke
          path: output/playwright/windows-smoke
          if-no-files-found: warn
